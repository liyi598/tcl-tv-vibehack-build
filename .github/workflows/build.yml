name: Build TCL TV Launcher

on:

  workflow_dispatch:

  push:

    paths:

      - ".github/workflows/build.yml"

permissions:

  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout build repository

        uses: actions/checkout@v4

      - name: Checkout tv-vibehack source

        uses: actions/checkout@v4

        with:

          repository: Gathin23/tv-vibehack

          ref: main

          path: source

      - name: Set up Java 17

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: "17"

      - name: Set up Android SDK

        uses: android-actions/setup-android@v3

      - name: Install Android SDK components

        run: |

          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build launcher APK

        working-directory: source/launcher

        run: |

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK

        if: success()

        uses: actions/upload-artifact@v4

        with:

          name: TCL-TV-Launcher

          path: source/launcher/app/build/outputs/apk/debug/*.apk

          if-no-files-found: error

          retention-days: 7
